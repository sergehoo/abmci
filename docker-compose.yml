networks:
  proxy:
    external: true     # Réseau Traefik existant
  abmci-network:
    driver: bridge

volumes:
  postgres_data:
  grafana_data:

services:
  abmciweb:
    build: .
    container_name: abmciweb
    env_file: [ .env ]
    environment:
      # Evite les doublons : gardons ces 2 var ici pour clarté (ou seulement dans Dockerfile)
      GDAL_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu/libgdal.so
      GEOS_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu/libgeos_c.so
      RUN_MIGRATIONS: "1"
    volumes:
      - .:/app
      - /var/www/abmci/staticfiles:/app/staticfiles
      - /var/www/abmci/media:/app/media
      - /home/ubuntu/abmci/creds/firebase-admin.json:/app/firebase-admin.json:ro
    depends_on:
      abmcidb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - abmci-network
      - proxy
    restart: unless-stopped
    # Limites CPU/RAM simples compatibles compose
    cpus: "0.80"
    mem_limit: "1024m"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy

      # Router principal HTTPS
      - traefik.http.routers.abmci.rule=Host(`administration.abmci.com`)
      - traefik.http.routers.abmci.entrypoints=websecure
      - traefik.http.routers.abmci.tls.certresolver=lets
      # Service (port interne)
      - traefik.http.services.abmci.loadbalancer.server.port=8000
      # Middlewares (optionnels – doivent exister côté Traefik)
      - traefik.http.routers.abmci.middlewares=sec-headers@docker,compress@docker,ratelimit@docker

  abmcidb:
    image: postgis/postgis:16-3.4
    container_name: abmcidb
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [ abmci-network ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  redis:
    image: redis:7
    container_name: abmciredis
    command: ["redis-server", "--appendonly", "yes", "--save", '""']  # évite snapshots -> CPU disque réduit
    networks: [ abmci-network ]
    restart: unless-stopped
    cpus: "0.20"
    mem_limit: "256m"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options: { max-size: "5m", max-file: "2" }

  celery:
    build: .
    container_name: abmcicelery
    command: >
      celery -A abmci worker
      --loglevel=warning
      --concurrency=1 --prefetch-multiplier=1
      --autoscale=2,1
      --max-tasks-per-child=100
      --without-gossip --without-mingle
    env_file: [ .env ]
    environment:
      GDAL_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu/libgdal.so
      GEOS_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu/libgeos_c.so
      CELERY_SEND_EVENTS: "False"
      CELERY_RESULT_BACKEND: ""   # pas de backend si non nécessaire
    volumes:
      - .:/app
    depends_on:
      abmcidb:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [ abmci-network ]
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: "512m"
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  celery-beat:
    profiles: [ "scheduler" ]   # 🚫 OFF par défaut
    build: .
    container_name: abmcicelerybeat
    command: >
      celery -A abmci beat
      --loglevel=warning
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: [ .env ]
    environment:
      GDAL_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu/libgdal.so
      GEOS_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu/libgeos_c.so
    volumes:
      - .:/app
    depends_on:
      abmcidb:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [ abmci-network ]
    restart: unless-stopped
    cpus: "0.20"
    mem_limit: "256m"
    logging:
      driver: "json-file"
      options: { max-size: "5m", max-file: "2" }

  # MONITORING (lourds) -> uniquement quand nécessaire
  prometheus:
    profiles: [ "monitoring" ]
    image: prom/prometheus:latest
    container_name: abmciprometheus
    volumes:
      - ./monitoring:/etc/prometheus:ro
    networks: [ abmci-network ]
    restart: unless-stopped
    cpus: "0.30"
    mem_limit: "512m"

  grafana:
    profiles: [ "monitoring" ]
    image: grafana/grafana
    container_name: abmcigrafana
    volumes:
      - grafana_data:/var/lib/grafana
    networks: [ abmci-network ]
    restart: unless-stopped
    cpus: "0.30"
    mem_limit: "512m"

  # Adminer on-demand, sous SOUS-DOMAINE dédié (évite le conflit Host)
  adminer:
    image: adminer
    container_name: abmci-adminer
    networks:
      - abmci-network
      - proxy
    restart: unless-stopped
    cpus: "0.10"
    mem_limit: "128m"
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.adminer.rule=Host(`adminer.abmci.com`)
      - traefik.http.routers.adminer.entrypoints=websecure
#      - traefik.http.routers.adminer.tls=true
      - traefik.http.routers.adminer.tls.certresolver=lets
      - traefik.http.services.adminer.loadbalancer.server.port=8080
#      - traefik.http.services.adminer.loadbalancer.server.scheme=http
      # Optionnel: BasicAuth si middleware défini côté Traefik
#      - traefik.http.routers.adminer.middlewares=traefik-auth@docker

