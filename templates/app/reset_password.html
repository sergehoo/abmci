<!doctype html>
<html lang="fr" class="h-full antialiased">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Réinitialiser le mot de passe – Alliance Connect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: {
                fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], display: ['Poppins', 'sans-serif'] },
                colors: { brand: {
                    50:'#EEF2FF',100:'#E0E7FF',500:'#6366F1',600:'#4F46E5',700:'#4338CA',
                }},
            }},
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        h1 { font-family: 'Poppins', 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-full bg-gradient-to-br from-slate-50 via-white to-brand-50/40 flex items-center justify-center px-4 py-10">

<div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
        <div class="p-6 border-b border-slate-100 bg-gradient-to-br from-brand-600 to-brand-700 text-white">
            <div class="flex items-center gap-3 mb-3">
                <div class="w-10 h-10 rounded-xl bg-white/20 grid place-items-center">
                    <i data-lucide="key-round" class="w-5 h-5"></i>
                </div>
                <div class="text-xs uppercase tracking-wider text-white/70 font-semibold">Alliance Connect</div>
            </div>
            <h1 class="font-display text-xl font-bold">Réinitialiser le mot de passe</h1>
            <p class="text-sm text-white/80 mt-1" id="intro">Ouverture de l'app…</p>
        </div>

        <div class="p-6 space-y-4">
            <button id="openAppBtn" type="button"
                    class="w-full h-11 rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm
                           flex items-center justify-center gap-2 transition shadow-sm">
                <i data-lucide="smartphone" class="w-4 h-4"></i>
                <span>Ouvrir dans l'app Alliance Connect</span>
            </button>

            <div class="relative my-2">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div>
                <div class="relative flex justify-center text-xs uppercase">
                    <span class="bg-white px-2 text-slate-400 font-semibold tracking-wider">ou</span>
                </div>
            </div>

            <p class="text-xs text-slate-500">
                Si l'app ne s'ouvre pas, vous pouvez définir un nouveau mot de passe ici :
            </p>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1.5">Nouveau mot de passe</label>
                <input id="pwd1" type="password" autocomplete="new-password"
                       class="w-full h-11 px-3 rounded-lg border border-slate-200 bg-slate-50
                              text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-400">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1.5">Confirmer</label>
                <input id="pwd2" type="password" autocomplete="new-password"
                       class="w-full h-11 px-3 rounded-lg border border-slate-200 bg-slate-50
                              text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-400">
            </div>

            <div class="flex items-center gap-3 pt-2">
                <a href="/" class="text-sm text-slate-500 hover:text-slate-700">Retour</a>
                <button id="submitBtn" type="button"
                        class="flex-1 h-11 rounded-lg bg-slate-900 hover:bg-slate-800 text-white font-semibold text-sm
                               flex items-center justify-center gap-2 transition shadow-sm
                               disabled:opacity-50 disabled:cursor-not-allowed">
                    <i data-lucide="check" class="w-4 h-4"></i>
                    <span>Valider</span>
                </button>
            </div>

            <div id="msg" class="text-sm"></div>
        </div>
    </div>
    <p class="mt-4 text-center text-xs text-slate-400">© 2024 ABMCI Monde</p>
</div>

<script>
    const qp = new URLSearchParams(location.search);
    const uid = qp.get('uid') || '';
    const token = qp.get('token') || '';
    const intro = document.getElementById('intro');
    const msg = document.getElementById('msg');
    const openBtn = document.getElementById('openAppBtn');
    const submitBtn = document.getElementById('submitBtn');

    const appSchemeUrl = `allianceconnect://reset-password?uid=${encodeURIComponent(uid)}&token=${encodeURIComponent(token)}`;

    function tryOpenApp() {
        window.location.href = appSchemeUrl;
    }

    if (uid && token) {
        intro.textContent = "Ouverture de l'app… Si rien ne se passe, utilisez le formulaire ci-dessous.";
        tryOpenApp();
    } else {
        intro.textContent = "Lien invalide (paramètres manquants).";
    }

    openBtn.addEventListener('click', tryOpenApp);

    async function submitReset() {
        msg.className = 'text-sm';
        msg.textContent = '';
        const pwd1 = document.getElementById('pwd1').value.trim();
        const pwd2 = document.getElementById('pwd2').value.trim();

        if (!uid || !token) { msg.classList.add('text-rose-600'); msg.textContent = "Lien invalide."; return; }
        if (!pwd1 || !pwd2) { msg.classList.add('text-rose-600'); msg.textContent = "Veuillez remplir les deux champs."; return; }
        if (pwd1 !== pwd2)  { msg.classList.add('text-rose-600'); msg.textContent = "Les mots de passe ne correspondent pas."; return; }

        submitBtn.disabled = true;
        try {
            const resp = await fetch('/api/auth/password/reset/confirm/', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ uid, token, new_password1: pwd1, new_password2: pwd2 }),
            });
            let data = {};
            try { data = await resp.json(); } catch(_) {}

            if (resp.ok) {
                msg.classList.add('text-emerald-600', 'font-medium');
                msg.textContent = "✓ Mot de passe changé. Vous pouvez vous connecter.";
            } else {
                msg.classList.add('text-rose-600');
                msg.textContent = data.detail || Object.values(data).flat().join(' ') || "Erreur lors de la réinitialisation.";
            }
        } catch (e) {
            msg.classList.add('text-rose-600');
            msg.textContent = "Erreur réseau. Réessayez.";
        } finally {
            submitBtn.disabled = false;
        }
    }

    submitBtn.addEventListener('click', submitReset);

    if (window.lucide) window.lucide.createIcons();
</script>
</body>
</html>
