
{% url url_name as link_url %}
<a href="{{ link_url }}"
   :class="isActive('{{ link_url }}')
       ? 'text-brand-600 dark:text-brand-300 font-semibold bg-brand-50 dark:bg-brand-900/30'
       : 'text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60'"
   class="block px-3 py-1.5 text-sm rounded-md transition">
    {{ label }}
</a>
