
<div class="py-16 text-center">
    <div class="w-16 h-16 mx-auto rounded-2xl bg-slate-100 dark:bg-slate-800 grid place-items-center mb-4">
        <svg class="w-8 h-8 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="{{ icon|default:'M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4' }}"/>
        </svg>
    </div>
    <p class="text-sm font-medium text-slate-700 dark:text-slate-200">{{ title|default:"Aucun élément" }}</p>
    {% if message %}<p class="text-xs text-slate-500 dark:text-slate-400 mt-1 max-w-sm mx-auto">{{ message }}</p>{% endif %}
    {% if cta_url %}
        <a href="{{ cta_url }}"
           class="inline-flex items-center gap-2 mt-5 px-4 h-10 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold shadow-sm transition">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
            <span>{{ cta_label|default:"Créer" }}</span>
        </a>
    {% endif %}
</div>
