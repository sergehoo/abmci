
{% with tone=tone|default:"brand" %}
<div class="group relative overflow-hidden bg-white dark:bg-slate-800/40 rounded-2xl border border-slate-200 dark:border-slate-700/60 shadow-soft p-5 lg:p-6
            hover:shadow-soft-lg hover:-translate-y-0.5 transition-all duration-300">
    {# Halo décoratif #}
    <div aria-hidden="true"
         class="absolute -top-12 -right-12 w-40 h-40 rounded-full opacity-20 blur-2xl
                {% if tone == 'emerald' %}bg-emerald-400
                {% elif tone == 'amber' %}bg-amber-400
                {% elif tone == 'violet' %}bg-violet-400
                {% elif tone == 'rose' %}bg-rose-400
                {% else %}bg-brand-400{% endif %}"></div>

    <div class="relative flex items-start justify-between">
        <div class="min-w-0">
            <div class="text-xs font-semibold tracking-wider uppercase text-slate-500 dark:text-slate-400">{{ title }}</div>
            <div class="mt-2 font-display text-2xl lg:text-3xl font-bold text-slate-900 dark:text-white tabular-nums">{{ value }}</div>
            {% if delta %}
                <div class="mt-1.5 inline-flex items-center gap-1 text-xs font-medium
                            {% if '-' in delta %}text-rose-600 dark:text-rose-400{% else %}text-emerald-600 dark:text-emerald-400{% endif %}">
                    {% if '-' in delta %}
                        <svg class="w-3 h-3" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M14.707 12.293a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 111.414-1.414L9 14.586V3a1 1 0 112 0v11.586l2.293-2.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
                    {% else %}
                        <svg class="w-3 h-3" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.707a1 1 0 010-1.414l4-4a1 1 0 011.414 0l4 4a1 1 0 11-1.414 1.414L11 5.414V17a1 1 0 11-2 0V5.414L6.707 7.707a1 1 0 01-1.414 0z" clip-rule="evenodd"/></svg>
                    {% endif %}
                    <span>{{ delta }}</span>
                    <span class="text-slate-400 dark:text-slate-500 font-normal">vs. mois dernier</span>
                </div>
            {% endif %}
        </div>
        <div class="shrink-0 w-12 h-12 rounded-xl grid place-items-center
                    {% if tone == 'emerald' %}bg-emerald-100 text-emerald-600 dark:bg-emerald-900/30 dark:text-emerald-300
                    {% elif tone == 'amber' %}bg-amber-100 text-amber-600 dark:bg-amber-900/30 dark:text-amber-300
                    {% elif tone == 'violet' %}bg-violet-100 text-violet-600 dark:bg-violet-900/30 dark:text-violet-300
                    {% elif tone == 'rose' %}bg-rose-100 text-rose-600 dark:bg-rose-900/30 dark:text-rose-300
                    {% else %}bg-brand-100 text-brand-600 dark:bg-brand-900/30 dark:text-brand-300{% endif %}">
            <i data-lucide="{{ icon|default:'activity' }}" class="w-5 h-5"></i>
        </div>
    </div>
</div>
{% endwith %}
